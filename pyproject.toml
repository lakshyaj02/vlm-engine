[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-engine"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10",
    "torch>=2.4",
    "transformers>=4.50,<5",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
